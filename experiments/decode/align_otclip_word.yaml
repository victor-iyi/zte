# Word-level EEG-OT-CLIP alignment (surface forms ↔ ZTE word embeddings).
text:
  model_name: hash
  embed_dim: 768
  max_length: 32
  pooling: mean
  normalize: true
  cache_dir: res/cache/text_embeddings
  backend: hash
  freeze: true
  device: auto
align:
  eeg_dim: 768
  text_dim: 768
  proj_dim: 768
  proj_hidden: 512
  temperature: 0.07
  lambda_infonce: 1.0
  lambda_ot: 0.1
  ot_epsilon: 0.05
  ot_iters: 20
  freeze_eeg_encoder: true
  level: word
  epochs: 15
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: cosine
  grad_clip: 1.0
  device: auto
  precision: auto
  seed: 42
  split: by_sentence
  val_fraction: 0.1
  loso_holdout_subject: null
  ckpt_dir: res/decode/alignment_word
  log_every: 20
  eval_every: 1
  tensorboard: false
  run_name: align_otclip_word
generative:
  lm_name: gpt2
  backend: toy
  prefix_len: 4
  prefix_dim: 768
  freeze_lm: true
  max_new_tokens: 16
  temperature: 1.0
  top_p: 0.9
  epochs: 5
  batch_size: 32
  lr: 5.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  device: auto
  precision: auto
  seed: 42
  ckpt_dir: res/decode/generative
  run_name: eeg-prefix-lm-word
mode: retrieval
zte_ckpt: res/checkpoints/best.pt
bundle: null
out_dir: res/decode/alignment_word
run_name: align_otclip_word
