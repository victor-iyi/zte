# Sentence-level EEG-OT-CLIP alignment with LOSO holdout (ZPH).
# Freeze the ZTE encoder; train projectors only (InfoNCE + Sinkhorn OT).
text:
  model_name: roberta-base
  embed_dim: 768
  max_length: 128
  pooling: mean
  normalize: true
  cache_dir: res/cache/text_embeddings
  backend: auto
  freeze: true
  device: auto
align:
  eeg_dim: 768
  text_dim: 768
  proj_dim: 768
  proj_hidden: 512
  temperature: 0.07
  lambda_infonce: 1.0
  lambda_ot: 0.1
  ot_epsilon: 0.05
  ot_iters: 20
  freeze_eeg_encoder: true
  level: sentence
  epochs: 20
  batch_size: 64
  lr: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: cosine
  grad_clip: 1.0
  device: auto
  precision: auto
  seed: 42
  split: by_subject_loso
  val_fraction: 0.1
  loso_holdout_subject: ZPH
  ckpt_dir: res/decode/alignment
  log_every: 10
  eval_every: 1
  tensorboard: false
  run_name: align_otclip_loso
generative:
  lm_name: gpt2
  backend: auto
  prefix_len: 8
  prefix_dim: 768
  freeze_lm: true
  max_new_tokens: 64
  temperature: 1.0
  top_p: 0.9
  epochs: 10
  batch_size: 16
  lr: 5.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  device: auto
  precision: auto
  seed: 42
  ckpt_dir: res/decode/generative
  run_name: eeg-prefix-lm
mode: retrieval
zte_ckpt: res/checkpoints/best.pt
bundle: null
out_dir: res/decode/alignment
run_name: align_otclip_loso
