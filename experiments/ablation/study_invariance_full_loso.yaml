# STUDY 2 (B) -- subject-invariance FULL stack, leave-one-subject-out.
# Skip-gram, EEG-only, split=by_subject_loso, holdout=ZAB, WITH the invariance stack:
# VICReg variance+covariance, per-subject normalisation (zscore_subject),
# cross-subject positives, and a gradient-reversal subject adversary (0.3).
# A/B partner: study_invariance_baseline_loso.yaml. Discovery question: does the stack
# push subject-decodability toward chance AND lift held-out cross-subject retrieval?
# Rotate train.loso_holdout_subject across all 12 subjects for a full LOSO sweep.
dataset:
  root: res/data/zuco_extracted
  tasks:
  - SR
  - NR
  subjects: null
  granularity: word
  representation: band_power
  band_power_measures:
  - TRT
  include_eye_tracking: false
  eye_tracking_measures:
  - FFD
  - GD
  - GPT
  - TRT
  - n_fixations
  - mean_pupil
  bands:
  - t1
  - t2
  - a1
  - a2
  - b1
  - b2
  - g1
  - g2
  raw_field: rawEEG
  raw_window: 128
  time_bins: 1
  normalize: zscore_subject
  normalizer_fit: train
  montage_csv: null
  bandpass: null
  missing:
    method: mask_only
    knn_neighbors: 5
    iterative_max_iter: 10
    interpolate_method: linear
    add_missing_indicator: true
  include_omitted: true
  min_words: 1
  max_words: null
  cache_dir: res/cache
  cache_format: npz
model:
  frontend: band_power_mlp
  embed_dim: 768
  hidden_dim: 256
  n_layers: 4
  n_heads: 8
  dropout: 0.1
  conformer_filters: 40
  conformer_temporal_kernel: 25
  pos_encoding: rope
  max_positions: 512
  spatial_encoding: none
  spatial_harmonic_degree: 6
  spatial_mix: true
  spatial_encoding_learnable: true
  spatial_attn_freqs: 8
  pool: attention
  subject_conditioning: false
  subject_film: false
  n_subjects: 12
  n_tasks: 3
  projection_hidden: 512
  factored: false
  content_dim: 384
  band_routing: false
objective:
  name: skipgram
  temperature: 0.07
  context_window: 2
  mask_ratio: 0.5
  masked_target: latent
  ema_decay: 0.999
  ema_decay_end: 0.9999
  teacher_variance_floor: 0.0001
  cpc_steps: 4
  variance_weight: 1.0
  covariance_weight: 1.0
  variance_target: 1.0
  anisotropy_weight: 0.0
  whiten: false
  cross_subject_positives: true
  meaning_positives: false
  subject_adversary_weight: 0.3
  stimulus_adversary_weight: 0.0
  meaning_distill_weight: 0.0
  meaning_source: null
  meaning_dim: 64
  hard_negatives: false
  hard_negative_keys:
  - subject
  - task
  behaviour_weight: 0.0
  behaviour_targets:
  - TRT
  - regression_time
  - is_omitted
  all_but_top: 0
  csls_neighbors: 0
  subject_adversary_warmup_ratio: 0.0
  alignment_weight: 0.0
  tau_plus: 0.0
  data2vec_aux_weight: 0.0
  meaning_contextual: null
  meaning_context_layer: -1
  eval_phase_shuffle: false
  eval_seen_novel: false
  eval_freq_matched: false
  text_source: null
  text_backend: auto
  text_query_prefix: ''
  clip_temperature: 0.07
  semantic_hard_negatives: false
  hard_negative_pool: 8
train:
  epochs: 40
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: cosine
  grad_accum_steps: 1
  grad_clip: 1.0
  device: auto
  precision: auto
  num_workers: -1
  static_shapes: auto
  split: by_subject_loso
  val_fraction: 0.1
  test_fraction: 0.1
  loso_holdout_subject: ZAB
  seed: 42
  deterministic: true
  log_every: 10
  eval_every: 1
  ckpt_dir: res/checkpoints
  ckpt_keep_last: 3
  tensorboard: true
  drive_backup_dir: null
  compile_model: false
run_name: study_invariance_full_loso
