# clip_e5_meaning_raw_v2 -- the encoder leap: the missing 2x2 cell PLUS a richer raw-conformer.
#
# Builds on clip_e5_meaning_raw (raw frontend + exp9 meaning distillation) and pushes the ENCODER alone.
# The band-power champion is capped at effective-rank 0.16 -- a thin space. The raw conformer already reaches
# 0.264, and its content probes lead the board, yet its temporal path is deliberately minimal: a single 25-tap
# (50 ms @ 500 Hz) band-pass and a flat mean over time. Three architecture changes lift that ceiling, each
# motivated by a specific limitation, none touching the objective (so any gain is attributable to the encoder):
#
#   1. Multi-scale temporal bank {15, 31, 63, 125}. One 50 ms kernel is biased to fast rhythms and cannot see a
#      full theta cycle (4-8 Hz ~ 125-250 ms) -- exactly the band that, with gamma, carries lexical-semantic
#      load. The bank spans ~33 Hz down to ~4 Hz in parallel and a pointwise conv fuses the scales, so one word
#      token is read at gamma, beta, alpha and theta at once.
#   2. Attentive temporal pool. The mean dilutes the informative window (e.g. the N400) with pre/post-word
#      baseline. A learned per-time-step weighting lets the token concentrate on the moments that matter.
#   3. Wider conformer (filters 40 -> 64). The self-attention over time runs at d_model = filters; 40 is a thin
#      pipe for four transformer heads. 64 (8 heads x 8) gives the temporal transformer room without changing
#      the 768-d output frame.
#
# Hypothesis: a richer per-word encoder raises the space's effective rank and content probes, and -- because the
# meaning target still forces a subject-invariant frame -- converts that extra content into retrieval past the
# 0.043 champion. Run AFTER clip_e5_meaning_raw so the frontend-swap effect and the architecture effect separate
# cleanly. Heavier frontend (~2M params, larger raw conv); if the Colab GPU OOMs, halve batch_size to 64.
dataset:
  root: res/data/zuco_extracted
  tasks:
  - SR
  - NR
  subjects: null
  granularity: word
  representation: raw
  band_power_measures:
  - TRT
  include_eye_tracking: false
  eye_tracking_measures:
  - FFD
  - GD
  - GPT
  - TRT
  - n_fixations
  - mean_pupil
  bands:
  - t1
  - t2
  - a1
  - a2
  - b1
  - b2
  - g1
  - g2
  raw_field: rawEEG
  raw_window: 350
  time_bins: 1
  normalize: riemannian
  normalizer_fit: train
  montage_csv: res/montage_gsn105.csv
  bandpass: null
  missing:
    method: mask_only
    knn_neighbors: 5
    iterative_max_iter: 10
    interpolate_method: linear
    add_missing_indicator: true
  include_omitted: true
  min_words: 1
  max_words: null
  cache_dir: res/cache
  cache_format: npz
model:
  frontend: raw_conformer
  embed_dim: 768
  hidden_dim: 256
  n_layers: 4
  n_heads: 8
  dropout: 0.1
  conformer_filters: 64
  conformer_temporal_kernel: 25
  conformer_multiscale_kernels:
  - 15
  - 31
  - 63
  - 125
  conformer_temporal_pool: attention
  pos_encoding: rope
  max_positions: 512
  spatial_encoding: spherical_harmonics
  spatial_harmonic_degree: 6
  spatial_mix: true
  spatial_encoding_learnable: true
  spatial_attn_freqs: 8
  pool: attention
  subject_conditioning: false
  subject_film: false
  n_subjects: 12
  n_tasks: 3
  projection_hidden: 512
  factored: true
  content_dim: 384
  band_routing: false
objective:
  name: clip
  temperature: 0.07
  context_window: 2
  mask_ratio: 0.5
  masked_target: latent
  ema_decay: 0.999
  ema_decay_end: 0.9999
  teacher_variance_floor: 0.0001
  cpc_steps: 4
  variance_weight: 1.0
  covariance_weight: 1.0
  variance_target: 1.0
  anisotropy_weight: 1.0
  whiten: true
  cross_subject_positives: true
  meaning_positives: true
  subject_adversary_weight: 0.1
  stimulus_adversary_weight: 0.3
  meaning_distill_weight: 1.0
  meaning_source: null
  meaning_dim: 768
  hard_negatives: false
  hard_negative_keys:
  - subject
  - task
  behaviour_weight: 0.5
  behaviour_targets:
  - TRT
  - regression_time
  - is_omitted
  all_but_top: 1
  csls_neighbors: 10
  subject_adversary_warmup_ratio: 0.3
  alignment_weight: 0.1
  tau_plus: 0.1
  data2vec_aux_weight: 0.5
  meaning_contextual: bert-base-uncased
  meaning_context_layer: 8
  eval_phase_shuffle: false
  eval_seen_novel: true
  eval_freq_matched: true
  text_source: intfloat/e5-base-v2
  text_backend: sentence-transformers
  text_query_prefix: 'query: '
  clip_temperature: 0.07
  semantic_hard_negatives: true
  hard_negative_pool: 8
train:
  epochs: 40
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: cosine
  grad_accum_steps: 1
  grad_clip: 1.0
  device: auto
  precision: auto
  num_workers: -1
  static_shapes: auto
  split: by_subject_loso
  val_fraction: 0.1
  test_fraction: 0.1
  loso_holdout_subject: ZAB
  seed: 42
  deterministic: true
  log_every: 10
  eval_every: 1
  ckpt_dir: res/checkpoints
  ckpt_keep_last: 3
  tensorboard: true
  drive_backup_dir: null
  compile_model: false
run_name: exp10_clip_e5_meaning_raw_v2
