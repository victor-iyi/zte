# clip_e5_meaning_raw -- the missing cell of the frontend x meaning-distillation 2x2.
#
# The 2026-07-24 LOSO board (held-out ZAB) reads as a clean 2x2 over {frontend} x {meaning distillation}:
#
#   frontend        meaning-distill   sent Top-1   eff-rank   subject var   anchor lift
#   band_power      off  (exp8_e5)       0.019       0.166       10.1%         +0.108
#   band_power      ON   (exp9_meaning)  0.043       0.160        0.9%         +0.084   <- champion
#   raw_conformer   off  (exp8_raw)      0.010       0.264        6.9%         +0.002
#   raw_conformer   ON   (this arm)       ?            ?            ?             ?       <- empty
#
# Meaning distillation is the disentangling force: turning it on under band_power cut subject-variance 10x
# (10.1% -> 0.9%) and more than doubled cross-subject retrieval (0.019 -> 0.043). The raw conformer already
# holds the richest space on the board (effective-rank 0.264 vs 0.160) and the best content probes, but with
# meaning distillation OFF it never disentangles subject (anchor calibration lift ~0) and its retrieval is weak.
#
# This arm fills the empty cell: the raw-conformer frontend under exp9's exact meaning objective. It is the
# controlled test of Victor's hypothesis -- does a richer per-word encoder, once the meaning target forces a
# subject-invariant frame, carry the champion past 0.043? Architecture is left IDENTICAL to exp8_raw (filters
# 40, single 25-tap kernel, mean temporal pool) so the only change vs exp8_raw is meaning distillation, and the
# only change vs exp9 is the frontend. Untested hypothesis, not a measured winner.
dataset:
  root: res/data/zuco_extracted
  tasks:
  - SR
  - NR
  subjects: null
  granularity: word
  representation: raw
  band_power_measures:
  - TRT
  include_eye_tracking: false
  eye_tracking_measures:
  - FFD
  - GD
  - GPT
  - TRT
  - n_fixations
  - mean_pupil
  bands:
  - t1
  - t2
  - a1
  - a2
  - b1
  - b2
  - g1
  - g2
  raw_field: rawEEG
  raw_window: 350
  time_bins: 1
  normalize: riemannian
  normalizer_fit: train
  montage_csv: res/montage_gsn105.csv
  bandpass: null
  missing:
    method: mask_only
    knn_neighbors: 5
    iterative_max_iter: 10
    interpolate_method: linear
    add_missing_indicator: true
  include_omitted: true
  min_words: 1
  max_words: null
  cache_dir: res/cache
  cache_format: npz
model:
  frontend: raw_conformer
  embed_dim: 768
  hidden_dim: 256
  n_layers: 4
  n_heads: 8
  dropout: 0.1
  conformer_filters: 40
  conformer_temporal_kernel: 25
  pos_encoding: rope
  max_positions: 512
  spatial_encoding: spherical_harmonics
  spatial_harmonic_degree: 6
  spatial_mix: true
  spatial_encoding_learnable: true
  spatial_attn_freqs: 8
  pool: attention
  subject_conditioning: false
  subject_film: false
  n_subjects: 12
  n_tasks: 3
  projection_hidden: 512
  factored: true
  content_dim: 384
  band_routing: false
objective:
  name: clip
  temperature: 0.07
  context_window: 2
  mask_ratio: 0.5
  masked_target: latent
  ema_decay: 0.999
  ema_decay_end: 0.9999
  teacher_variance_floor: 0.0001
  cpc_steps: 4
  variance_weight: 1.0
  covariance_weight: 1.0
  variance_target: 1.0
  anisotropy_weight: 1.0
  whiten: true
  cross_subject_positives: true
  meaning_positives: true
  subject_adversary_weight: 0.1
  stimulus_adversary_weight: 0.3
  meaning_distill_weight: 1.0
  meaning_source: null
  meaning_dim: 768
  hard_negatives: false
  hard_negative_keys:
  - subject
  - task
  behaviour_weight: 0.5
  behaviour_targets:
  - TRT
  - regression_time
  - is_omitted
  all_but_top: 1
  csls_neighbors: 10
  subject_adversary_warmup_ratio: 0.3
  alignment_weight: 0.1
  tau_plus: 0.1
  data2vec_aux_weight: 0.5
  meaning_contextual: bert-base-uncased
  meaning_context_layer: 8
  eval_phase_shuffle: false
  eval_seen_novel: true
  eval_freq_matched: true
  text_source: intfloat/e5-base-v2
  text_backend: sentence-transformers
  text_query_prefix: 'query: '
  clip_temperature: 0.07
  semantic_hard_negatives: true
  hard_negative_pool: 8
train:
  epochs: 40
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: cosine
  grad_accum_steps: 1
  grad_clip: 1.0
  device: auto
  precision: auto
  num_workers: -1
  static_shapes: auto
  split: by_subject_loso
  val_fraction: 0.1
  test_fraction: 0.1
  loso_holdout_subject: ZAB
  seed: 42
  deterministic: true
  log_every: 10
  eval_every: 1
  ckpt_dir: res/checkpoints
  ckpt_keep_last: 3
  tensorboard: true
  drive_backup_dir: null
  compile_model: false
run_name: exp10_clip_e5_meaning_raw
