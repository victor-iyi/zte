# zte_encoder_v3 -- exp16. Four mechanisms, four measured failures, one variable each.
#
# WHERE exp12/exp14 LEFT IT (real ZuCo, LOSO ZAB, 2026-08-13):
#   held-out rank percentile     0.9636  [0.9599, 0.9674]   -- real, and the honest headline
#   length-stratified            0.9211  [0.9154, 0.9270]   -- still real once length is held constant
#   variance budget              8.4% subject / 0.0% content / 91.6% neither
#   same word, diff subject      cosine gap +0.005          -- not clustered
#   held-out word_len probe      R2 -0.060                  -- below chance
#   decoder rescoring, stratified rank percentile 0.4349    -- below chance: the rescorer rides length alone
#
# Read together those say the sentence signal is real but thin, the word signal is absent, and nine tenths of the
# space's variance is neither identity nor any content attribute we can name -- i.e. single-trial noise. Thirteen
# arms on 2026-07-25 flipping alignment, the adapter and identity orthogonality all landed between 2 and 9 hits in
# 700. The exposed levers are exhausted; these four are architectural.
#
#   model.residual_coding          Subtract what the left context already predicted. The reader's tonic state and
#                                  1/f background are predictable from the last few seconds and cancel; a surprisal
#                                  response is not and does not. Ablation: exp16_residual_off.
#   objective.consensus_*          Twelve people read every sentence, so the content is their running average and a
#                                  single reading is that plus noise. Distil each reading toward its cross-reader
#                                  prototype, and make it pick its own prototype out of all of them -- the
#                                  evaluation, scored EEG-to-EEG. Ablation: exp16_consensus_off.
#   objective.gallery_*            Score against all 700 texts, not the 15 in the batch, with the denominator
#                                  restricted to texts of the same length so counting words is worth nothing.
#                                  Ablations: exp16_gallery_off, exp16_gallery_band_off.
#   objective.length_projection    Remove the train-fitted length subspace from the exported embeddings, then
#                                  measure. Ablation: exp16_length_projection_off.
#
# NOT YET MEASURED ON REAL ZuCo. This sits in flagship/ as the best-designed encoder, not the best-measured one;
# exp12_zte_raw_aligned still holds that title until this runs.
dataset:
  root: res/data/zuco_extracted
  tasks:
  - SR
  - NR
  subjects: null
  granularity: word
  representation: raw
  band_power_measures:
  - TRT
  include_eye_tracking: false
  eye_tracking_measures:
  - FFD
  - GD
  - GPT
  - TRT
  - n_fixations
  - mean_pupil
  bands:
  - t1
  - t2
  - a1
  - a2
  - b1
  - b2
  - g1
  - g2
  raw_field: rawEEG
  raw_window: 350
  time_bins: 1
  normalize: riemannian
  normalizer_fit: train
  montage_csv: res/montage_gsn105.csv
  bandpass: null
  raw_align: euclidean
  raw_align_fit: all
  subject_signature: true
  missing:
    method: mask_only
    knn_neighbors: 5
    iterative_max_iter: 10
    interpolate_method: linear
    add_missing_indicator: true
  include_omitted: true
  min_words: 1
  max_words: null
  cache_dir: res/cache
  cache_format: npz
model:
  frontend: raw_conformer
  embed_dim: 768
  hidden_dim: 256
  n_layers: 4
  n_heads: 8
  dropout: 0.1
  conformer_filters: 40
  conformer_temporal_kernel: 25
  pos_encoding: rope
  max_positions: 512
  spatial_encoding: spherical_harmonics
  spatial_harmonic_degree: 6
  spatial_mix: true
  spatial_encoding_learnable: true
  spatial_attn_freqs: 8
  pool: attention
  subject_conditioning: false
  subject_film: false
  subject_adapter: true
  subject_adapter_width: 128
  subject_adapter_spatial: true
  n_subjects: 12
  n_tasks: 3
  grad_checkpoint: true
  projection_hidden: 512
  factored: true
  content_dim: 384
  band_routing: false
  residual_coding: true
  residual_layers: 1
  residual_gate: 1.0
  residual_predict_weight: 1.0
objective:
  name: clip
  temperature: 0.07
  context_window: 2
  mask_ratio: 0.5
  masked_target: latent
  ema_decay: 0.999
  ema_decay_end: 0.9999
  teacher_variance_floor: 0.0001
  cpc_steps: 4
  variance_weight: 1.0
  covariance_weight: 1.0
  variance_target: 1.0
  anisotropy_weight: 1.0
  whiten: true
  cross_subject_positives: true
  meaning_positives: true
  subject_adversary_weight: 0.05
  identity_orthogonality_weight: 1.0
  stimulus_adversary_weight: 0.3
  meaning_distill_weight: 1.0
  meaning_source: null
  meaning_dim: 768
  hard_negatives: false
  hard_negative_keys:
  - subject
  - task
  behaviour_weight: 0.5
  behaviour_targets:
  - TRT
  - regression_time
  - is_omitted
  all_but_top: 1
  csls_neighbors: 10
  subject_adversary_warmup_ratio: 0.3
  alignment_weight: 0.1
  tau_plus: 0.1
  data2vec_aux_weight: 0.5
  meaning_contextual: bert-base-uncased
  meaning_context_layer: 8
  eval_phase_shuffle: false
  eval_seen_novel: true
  eval_freq_matched: true
  text_source: intfloat/e5-base-v2
  text_backend: sentence-transformers
  text_query_prefix: 'query: '
  clip_temperature: 0.07
  semantic_hard_negatives: true
  hard_negative_pool: 8
  lexical_weight: 1.0
  lexical_reader_weight: 1.0
  lexical_temperature: 0.07
  lexical_source: null
  lexical_max_tokens: 4096
  lexical_same_subject_negatives: true
  consensus_weight: 1.0
  consensus_gallery_weight: 0.5
  consensus_word_weight: 0.25
  consensus_decay: 0.99
  consensus_min_readers: 2
  consensus_temperature: 0.07
  consensus_gallery_size: 1024
  gallery_weight: 1.0
  gallery_length_band: 2
  gallery_min_candidates: 32
  length_projection: true
train:
  epochs: 40
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: cosine
  grad_accum_steps: 1
  grad_clip: 1.0
  device: auto
  precision: auto
  num_workers: -1
  static_shapes: auto
  split: by_subject_loso
  val_fraction: 0.1
  test_fraction: 0.1
  loso_holdout_subject: ZAB
  seed: 42
  deterministic: true
  log_every: 10
  eval_every: 1
  ckpt_dir: res/checkpoints
  ckpt_keep_last: 3
  tensorboard: true
  drive_backup_dir: null
  compile_model: false
run_name: exp16_zte_encoder_v3
