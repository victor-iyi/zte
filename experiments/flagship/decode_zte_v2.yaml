# decode_zte_v2 -- the decoder, rebuilt. A frozen LM on a metered leash, steered word by word.
#
# THE ARITHMETIC THIS IS BUILT AROUND, measured on the real 700-stimulus SR+NR gallery and not negotiable:
# sentence identity needs 9.4512 bits; word count alone carries 5.1422 of them, free, because ZuCo's word
# segmentation comes from eye tracking; the encoder it actually ran over measures 0.6390 (train-fitted, full gallery).
# A 19.6-word English sentence needs roughly 190 bits. Free generation is therefore an expected null and is
# reported as one. The powered readout is decoder-rescoring retrieval, and it is labelled retrieval everywhere.
#
# Two things are new here, and both exist to make that arithmetic auditable rather than argued.
#
# 1. THE SEMANTIC RATE LADDER (`decoder.rate_ladder: rvq`). The conditioning vector passes through four
#    residual codebooks of 256 codes each, seeded by k-means on the frozen *text* cloud so a code names a
#    region the LM already writes fluent English from. The channel then carries at most 4 x log2(256) = 32
#    bits by construction, and `bit_budget` in generation.json reports how many it actually delivered against
#    the 9.45 it would need. Stage 0 is reserved for word count (`rate_length_stage: true`) and the remaining
#    stages are penalised for correlating with it, so the residual code's mutual information is the part of
#    the answer the brain supplied rather than the part eye tracking gave away.
#
# 2. WORD-SYNCHRONOUS LEXICAL EVIDENCE (`decoder.evidence_schedule: linear`). A pooled prefix spends its
#    influence in the first few generated tokens. This walks a soft monotonic pointer across the reading's
#    word tokens as the LM decodes and nudges the LM's final hidden state -- exactly a rank-64 additive bias
#    on the frozen output head, no new vocabulary parameters, one decode path. The pointer schedule depends
#    only on the step count and the word count, never on content, so every control inherits it: the
#    `length_only` control keeps the schedule and zeroes the content, which is what isolates the 5.14 bits.
#    The gate starts at zero, so the run begins as the pooled decoder and the evidence earns its way in.
#
# The evidence path reads the per-word projection the ENCODER trained, so this arm must be built over
# experiments/flagship/zte_lexical_raw.yaml. Over an encoder without one it degrades to the pooled decoder and
# says so at startup. `cache_embeddings` is false because the evidence path needs the per-word hiddens every
# step; expect roughly an encoder run's cost plus the frozen LM.
#
# `objective.eval_capacity: true` adds the third readout: the largest K-way menu this decoder is certified to
# serve, against its own length_only / shuffled_eeg / mismatch conditioning arms on exact-word-count pools. Every
# menu is a column slice of the gallery pass rescoring already runs; only the length_only arm costs an extra pass,
# and that is one per distinct word count rather than one per query. Expect
# `certified_k: null` on the first real run -- that is a reported outcome with its failing clause named, not a
# blank. K=32 and K=64 come back unreachable, because an exact word-count pool holds ~8 candidates on a
# 300-sentence gallery. A capacity is MENU SELECTION and is never quoted as generation.
#
# Pin decoder.lm_revision to the SHA the run log reports before any number leaves the repo.
#
#   uv run zte-run --config experiments/flagship/decode_zte_v2.yaml --root res/data/zuco_extracted \
#       --encoder-ckpt res/experiments/exp14_zte_lexical_raw_loZAB/checkpoints/best.pt --resume
#   uv run zte-decode --ckpt res/experiments/exp15_decode_zte_v2/checkpoints/best.pt \
#       --root res/data/zuco_extracted --split test --rescore --capacity
dataset:
  root: res/data/zuco_extracted
  tasks:
  - SR
  - NR
  subjects: null
  granularity: word
  representation: raw
  band_power_measures:
  - TRT
  include_eye_tracking: false
  eye_tracking_measures:
  - FFD
  - GD
  - GPT
  - TRT
  - n_fixations
  - mean_pupil
  bands:
  - t1
  - t2
  - a1
  - a2
  - b1
  - b2
  - g1
  - g2
  raw_field: rawEEG
  raw_window: 350
  time_bins: 1
  normalize: riemannian
  normalizer_fit: train
  montage_csv: res/montage_gsn105.csv
  bandpass: null
  raw_align: euclidean
  raw_align_fit: all
  subject_signature: true
  missing:
    method: mask_only
    knn_neighbors: 5
    iterative_max_iter: 10
    interpolate_method: linear
    add_missing_indicator: true
  include_omitted: true
  min_words: 1
  max_words: null
  cache_dir: res/cache
  cache_format: npz
model:
  frontend: raw_conformer
  embed_dim: 768
  hidden_dim: 256
  n_layers: 4
  n_heads: 8
  dropout: 0.1
  conformer_filters: 40
  conformer_temporal_kernel: 25
  pos_encoding: rope
  max_positions: 512
  spatial_encoding: spherical_harmonics
  spatial_harmonic_degree: 6
  spatial_mix: true
  spatial_encoding_learnable: true
  spatial_attn_freqs: 8
  pool: attention
  subject_conditioning: false
  subject_film: false
  subject_adapter: true
  subject_adapter_width: 128
  subject_adapter_spatial: true
  n_subjects: 12
  n_tasks: 3
  grad_checkpoint: true
  projection_hidden: 512
  factored: true
  content_dim: 384
  band_routing: false
objective:
  name: decode
  temperature: 0.07
  context_window: 2
  mask_ratio: 0.5
  masked_target: latent
  ema_decay: 0.999
  ema_decay_end: 0.9999
  teacher_variance_floor: 0.0001
  cpc_steps: 4
  variance_weight: 1.0
  covariance_weight: 1.0
  variance_target: 1.0
  anisotropy_weight: 1.0
  whiten: true
  cross_subject_positives: true
  meaning_positives: true
  subject_adversary_weight: 0.1
  identity_orthogonality_weight: 0.0
  stimulus_adversary_weight: 0.3
  meaning_distill_weight: 0.0
  meaning_source: res/vectors/glove.300d.txt
  meaning_dim: 300
  hard_negatives: false
  hard_negative_keys:
  - subject
  - task
  behaviour_weight: 0.5
  behaviour_targets:
  - TRT
  - regression_time
  - is_omitted
  all_but_top: 1
  csls_neighbors: 10
  subject_adversary_warmup_ratio: 0.3
  alignment_weight: 0.1
  tau_plus: 0.1
  data2vec_aux_weight: 0.5
  meaning_contextual: null
  meaning_context_layer: -1
  eval_phase_shuffle: false
  eval_seen_novel: true
  eval_freq_matched: true
  eval_generation: true
  eval_rescoring: true
  eval_capacity: true
  eval_length_stratified: true
  text_source: intfloat/e5-base-v2
  text_backend: sentence-transformers
  text_query_prefix: 'query: '
  clip_temperature: 0.07
  semantic_hard_negatives: true
  hard_negative_pool: 8
  lexical_weight: 0.0
  lexical_reader_weight: 0.0
  lexical_temperature: 0.07
  lexical_source: null
  lexical_max_tokens: 4096
  lexical_same_subject_negatives: true
train:
  epochs: 20
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: cosine
  grad_accum_steps: 1
  grad_clip: 1.0
  device: auto
  precision: auto
  num_workers: -1
  static_shapes: auto
  split: by_subject_and_stimulus
  val_fraction: 0.1
  test_fraction: 0.15
  loso_holdout_subject: ZAB
  seed: 42
  deterministic: true
  log_every: 10
  eval_every: 1
  ckpt_dir: res/checkpoints
  ckpt_keep_last: 1
  tensorboard: true
  drive_backup_dir: null
  compile_model: false
  mode: decoder
  encoder_ckpt: res/experiments/exp16_residual_off_loZAB_s42/checkpoints/best.pt
  freeze_encoder: true
  bridge_lr: 0.001
  encoder_lr_scale: 0.1
  stage_a_epochs: 3
  early_stop_patience: 8
run_name: exp15_decode_zte_v2
decoder:
  lm_source: Qwen/Qwen2.5-0.5B
  lm_revision: null
  tokenizer_source: null
  lm_cache_dir: null
  conditioning: pooled
  prefix_slots: 8
  word_slots: 8
  bottleneck: 128
  gap_correction: mean_scale
  null_prefix_prob: 0.1
  cfg_weight: 1.0
  ground_weight: 0.5
  ground_negatives: 3
  max_target_tokens: 96
  max_new_tokens: 96
  beams: 1
  stage0_epochs: 20
  min_prefix_kl: 0.05
  clip_aux_weight: 1.0
  cache_embeddings: false
  prompt_template: '

    Sentence: '
  generation_controls:
  - mean_prefix
  - null_prefix
  - phase
  - noise
  - noise_prefix
  - shuffled_z
  - length_only
  - mismatch
  n_permutations: 1000
  rescore_gallery: true
  length_tol: 1
  rate_ladder: rvq
  rate_stages: 4
  rate_codes: 256
  rate_length_stage: true
  rate_length_weight: 1.0
  evidence_schedule: linear
  evidence_rank: 64
  evidence_width: 1.5
  evidence_gate_init: 0.0
  ground_hard_length: true
  bridge_depth: 2
  within_task_pools:
  - SR
  - NR
  rescore_chunk: 64
  eval_seeds: []
