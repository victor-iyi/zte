[project]
name = 'zte'
version = '0.1.0'
description = 'ZuCo Thought Embedding (ZTE): a tunable ZuCo dataset toolkit and a state-of-the-art self-supervised EEG embedding pipeline for the Cross-Modal Transfer Learning project.'
readme = 'README.md'
# Target runtime is CPython 3.14; the floor is 3.12 so the smoke-train can run
# on platforms where PyTorch wheels for 3.14 are not yet published. Bump to
# '>=3.14' once your local torch build supports it -- nothing in the source
# relies on pre-3.12 behaviour.
requires-python = '>=3.12'
license = { text = 'MIT' }
authors = [{ name = 'Victor I. Afolabi', email = 'javafolabi@gmail.com' }]
keywords = ['eeg', 'zuco', 'bci', 'self-supervised', 'embeddings', 'pytorch', 'neuroscience']

dependencies = [
  'h5py>=3.16.0',
  'matplotlib>=3.11.0',
  'numpy>=2.5.0',
  'pandas>=3.0.3',
  'pyyaml>=6.0.3',
  'rich>=13.7',
  'scikit-learn>=1.9.0',
  'scipy>=1.18.0',
  'torch>=2.12.1',
  'tqdm>=4.68.3',
]

[dependency-groups]
drive = ['gdown>=6.1.0']
logging = ['tensorboard>=2.20.0']
viz = ['seaborn>=0.13.2']
dev = ['ruff>=0.15.18', 'pytest>=9.1.1', 'mypy>=2.1.0']
all = [
  { include-group = 'drive' },
  { include-group = 'logging' },
  { include-group = 'viz' },
]

[project.scripts]
zte-prepare = 'zte.cli.prepare:main'
zte-train = 'zte.cli.train:main'
zte-extract = 'zte.cli.extract:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/zte']

[tool.uv]
package = true
default-groups = ['all']

# --- Formatting / linting (per project convention) -------------------------
[tool.ruff]
line-length = 100
target-version = 'py312'
src = ['src', 'tests']

[tool.ruff.format]
quote-style = 'single'
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  # PyLint
  'PL',
  # PyFlakes
  'F',
  # Isort
  'I',
]
# The synthetic generator and trainer legitimately carry many local variables
# and arguments; relax the PyLint heuristics that fight scientific code.
# PLC0415 is intentional: optional dependencies (sklearn, gdown, tensorboard,
# seaborn, h5py, pydrive2, google.colab) and a few cycle-breaking package
# imports are loaded lazily inside functions on purpose.
ignore = [
  'PLR0913',  # too-many-arguments
  'PLR0914',  # too-many-locals
  'PLR0915',  # too-many-statements
  'PLR0912',  # too-many-branches
  'PLR0911',  # too-many-return-statements
  'PLR2004',  # magic-value-comparison
  'PLC0415',  # import-outside-top-level (lazy/optional imports by design)
]

[tool.ruff.lint.isort]
known-first-party = ['zte']

[tool.mypy]
python_version = '3.12'
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
reportArgumentType = "none"
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
reportOptionalCall = "none"
reportOptionalMemberAccess = "none"
reportUnboundVariable = "none"
reportUnusedExpression = "none"
reportAttributeAccessIssue = "none"
