[project]
name = 'zte'
version = "0.5.0"
description = 'ZuCo Thought Embedding (ZTE): a tunable ZuCo dataset toolkit and a state-of-the-art self-supervised EEG embedding pipeline for the Cross-Modal Transfer Learning project.'
readme = 'README.md'
requires-python = '>=3.14'
license = { text = 'MIT' }
authors = [{ name = 'Victor I. Afolabi', email = 'iyiola.afolabi@stu.mmu.ac.uk' }]
keywords = ['eeg', 'zuco', 'bci', 'self-supervised', 'embeddings', 'pytorch', 'neuroscience']

dependencies = [
  'h5py>=3.16.0',
  'matplotlib>=3.11.1',
  'numpy>=2.5.2',
  'pandas>=3.0.5',
  'pyyaml>=6.0.3',
  'rich>=15.0.0',
  'scikit-learn>=1.9.0',
  'scipy>=1.18.1',
  'torch>=2.13.0',
  'tqdm>=4.70.0',
]

[dependency-groups]
drive = [
  'gdown>=6.1.0',
]
logging = [
  'tensorboard>=2.21.0',
]
viz = [
  'seaborn>=0.13.2',
  'plotly>=6.9.0',
]
# Optional: use `mne` to fetch real electrode coordinates for spatial encoding.
spatial = [
  'mne>=1.12.1',
]
# Optional HuggingFace (e.g. BERT) encoder for contextual meaning targets.
# Enable with `uv sync --group meaning` if needed; otherwise, no extra dependencies required.
meaning = [
  # Requires transformers >=4.56 for correct dtype loading.
  'transformers>=5.15.1',
  'sentence-transformers>=6.0.0',
]
dev = [
  'ruff>=0.16.4',
  'pytest>=9.1.1',
  'mypy>=2.3.1',
]

all = [
  { include-group = 'drive' },
  { include-group = 'logging' },
  { include-group = 'viz' },
]

[project.scripts]
zte-prepare = 'zte.cli.prepare:main'
zte-train = 'zte.cli.train:main'
zte-extract = 'zte.cli.extract:main'
zte-evaluate = 'zte.cli.evaluate:main'
zte-decode = 'zte.cli.decode:main'
zte-rebaseline = 'zte.cli.rebaseline:main'
zte-explore = 'zte.cli.explore:main'
zte-benchmark = 'zte.cli.benchmark:main'
zte-run = 'zte.cli.run:main'
zte-audit = 'zte.cli.audit:main'
zte-ablate = 'zte.cli.ablate:main'
zte-download = 'zte.cli.download:main'
zte-visualize = 'zte.cli.visualize:main'
zte-compare = 'zte.cli.compare:main'
zte-loso-summary = 'zte.cli.loso_summary:main'
zte-encodability = 'zte.cli.encodability:main'
zte-lens = 'zte.cli.lens:main'
zte-pack = 'zte.cli.pack:main'
zte-parallax = 'zte.cli.parallax:main'
zte-analyze = 'zte.cli.analyze:main'
zte-studio = 'zte.cli.studio:main'
zte-colab = 'zte.cli.colab:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/zte']
# The interactive explorers ship their front-end sources as data files (loaded at runtime by
# zte.evaluation.interactive._assets.load_page); keep them in the wheel alongside the package.
artifacts = [
  'src/zte/evaluation/interactive/web/*/*.html',
  'src/zte/evaluation/interactive/web/*/*.css',
  'src/zte/evaluation/interactive/web/*/*.js',
  'src/zte/parallax/web/*/*.html',
  'src/zte/parallax/web/*/*.css',
  'src/zte/parallax/web/*/*.js',
  'src/zte/lens/web/*/*.html',
  'src/zte/lens/web/*/*.css',
  'src/zte/lens/web/*/*.js',
]

[tool.uv]
package = true
default-groups = ['all', 'dev']

# --- Formatting / linting (per project convention) -------------------------
[tool.ruff]
line-length = 120
target-version = 'py314'
src = ['src', 'tests']

[tool.ruff.format]
quote-style = 'single'
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  # PyLint
  'PL',
  # PyFlakes
  'F',
  # Isort
  'I',
]
ignore = [
  'PLR0913',  # too-many-arguments
  'PLR0917',  # too-many-positional-arguments
  'PLR0914',  # too-many-locals
  'PLR0915',  # too-many-statements
  'PLR0912',  # too-many-branches
  'PLR0911',  # too-many-return-statements
  'PLR2004',  # magic-value-comparison
  'PLC0415',  # import-outside-top-level (lazy/optional imports by design)
]

[tool.ruff.lint.isort]
known-first-party = ['zte']

[tool.mypy]
python_version = '3.14'
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
reportArgumentType = "none"
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
reportOptionalCall = "none"
reportOptionalMemberAccess = "none"
reportUnboundVariable = "none"
reportUnusedExpression = "none"
reportAttributeAccessIssue = "none"
